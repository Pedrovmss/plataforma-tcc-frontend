<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <title>Plataforma TCC</title>
</head>

<body>

    <header>
        <nav class="navbar navbar-dark navbar-light fixed-top"
            style="background-color: #0d065f;">

            <section class="container-fluid">

                <a href="https://www.udf.edu.br/">
                    <img src="https://www.udf.edu.br/wp-content/themes/cruzeiroportais2019/assets/imagens/marcas/marcaUdfVariacaoReduzida.svg"
                        alt="Logo UDF"
                        width="128"
                        height="128">
                </a>

                <a class="navbar-brand"
                    style="font-family: Times New Roman, Times, serif;">
                    Revista Acadêmica
                </a>

                <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasDarkNavbar"
                    aria-controls="offcanvasDarkNavbar"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <aside class="bg-dark text-white offcanvas offcanvas-end text-bg-dark"
                    tabindex="-1"
                    id="offcanvasDarkNavbar"
                    aria-labelledby="offcanvasDarkNavbarLabel">

                    <header class="offcanvas-header">

                        <h5 class="offcanvas-title"
                            id="offcanvasDarkNavbarLabel"
                            style="font-family: Arial, Helvetica, sans-serif;">
                            Menu
                        </h5>

                        <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="offcanvas"
                            aria-label="Close">
                        </button>

                    </header>

                    <section class="offcanvas-body">

                        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">

                            <li class="nav-item">
                                <a class="nav-link active"
                                    href="#">
                                    Home
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                    href="Login.html">
                                    Login
                                </a>
                            </li>

                            <li class="nav-item dropdown">

                                <a class="nav-link dropdown-toggle"
                                    href="#"
                                    role="button"
                                    data-bs-toggle="dropdown">

                                    Postagens

                                </a>

                                <ul class="dropdown-menu dropdown-menu-dark">

                                    <li>
                                        <a class="dropdown-item" href="#">
                                            Adicionar
                                        </a>
                                    </li>

                                    <li>
                                        <a class="dropdown-item" href="#">
                                            Listar
                                        </a>
                                    </li>

                                </ul>

                            </li>

                        </ul>

                        <form class="d-flex mt-3" role="search">

                            <input class="form-control me-2"
                                type="search"
                                placeholder="Repositório"
                                aria-label="Search">

                            <button class="btn btn-success"
                                type="submit">

                                Pesquisar

                            </button>

                        </form>

                    </section>

                </aside>

            </section>

        </nav>
    </header>

    <main id="root"></main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="./src/JSX/main.jsx"></script>

</body>

</html>
